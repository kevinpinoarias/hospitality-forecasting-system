# Ruff linter settings. Deliberately small: real bugs and unused code only
# (E4/E7/E9 = import, statement and syntax errors; F = pyflakes: unused or
# undefined names). No style rules - formatting is not enforced.
# Run locally with:  ruff check .
extend-exclude = ["wandb", "data_cache", "models", "reports"]

[lint]
select = ["E4", "E7", "E9", "F"]
