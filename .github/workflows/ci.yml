name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WANDB_MODE: disabled # the training code logs to wandb; CI has no login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints-experiments.txt
      - name: Install dependencies
        run: >
          pip install
          -r requirements-ci.txt
          -c constraints-experiments.txt
          --extra-index-url https://download.pytorch.org/whl/cpu

      # The model and its data are not in git. They are rebuilt from the raw
      # data - unless nothing that feeds them has changed since a run that
      # already built them, in which case that run's copy is reused. The key
      # is a fingerprint of every input: change one file below and the
      # fingerprint changes, so the model is retrained.
      - name: Restore the model if its inputs are unchanged
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            data/interim
            data/processed
            data/features
            models
            reports
          key: model-${{ runner.os }}-py3.11-${{ hashFiles('data/raw/**', 'src/preprocessing/**', 'src/features/**', 'src/models/**', 'src/evaluation/**', 'src/experiments/**', 'rebuild_model.py', 'constraints-experiments.txt', 'requirements-ci.txt') }}
      - name: Rebuild the model from the raw data
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python rebuild_model.py

      - run: pytest -q

      - name: Keep the rebuilt model for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-model
          path: |
            models/final_model
            data/features/engineered_features.csv
            reports/results/final_model_metrics.csv
          retention-days: 7
          if-no-files-found: error
