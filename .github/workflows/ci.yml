name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The "Run workflow" button: also redeploys both services, whatever changed.
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # never cancel a deploy half-way

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WANDB_MODE: disabled # the training code logs to wandb; CI has no login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints-experiments.txt
      - name: Install dependencies
        run: >
          pip install
          -r requirements-ci.txt
          -c constraints-experiments.txt
          --extra-index-url https://download.pytorch.org/whl/cpu

      # The model and its data are not in git. They are rebuilt from the raw
      # data - unless nothing that feeds them has changed since a run that
      # already built them, in which case that run's copy is reused. The key
      # is a fingerprint of every input: change one file below and the
      # fingerprint changes, so the model is retrained.
      - name: Restore the model if its inputs are unchanged
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            data/interim
            data/processed
            data/features
            models
            reports
          key: model-${{ runner.os }}-py3.11-${{ hashFiles('data/raw/**', 'src/preprocessing/**', 'src/features/**', 'src/models/**', 'src/evaluation/**', 'src/experiments/**', 'src/config.py', 'config/config.yaml', 'rebuild_model.py', 'constraints-experiments.txt', 'requirements-ci.txt') }}
      - name: Rebuild the model from the raw data
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python rebuild_model.py

      - run: pytest -q

      # Fails the build if the rebuilt model's error drifts from the expected
      # figure in config/quality_gate.json by more than the tolerance.
      - name: Quality gate
        run: python scripts/quality_gate.py

      - name: Keep the rebuilt model for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-model
          path: |
            models/final_model
            data/features/engineered_features.csv
            reports/results/final_model_metrics.csv
          retention-days: 7
          if-no-files-found: error

  image:
    name: Image (build and smoke test)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the model the tests job rebuilt
        uses: actions/download-artifact@v4
        with:
          name: rebuilt-model
      - name: Check the model arrived
        run: test -f models/final_model/metadata.json && test -f data/features/engineered_features.csv
      - uses: docker/setup-buildx-action@v3

      # The model is copied into the image by the Dockerfile's `COPY . .`.
      # Layers that did not change (the pip install, mostly) come from the
      # cache, so an unchanged image rebuilds in seconds.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hospitality-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Start the container
        run: docker run -d --name api -p 8000:8000 hospitality-api:ci
      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8000
      - name: Show the container's log if something failed
        if: failure()
        run: docker logs api

      # Built only to prove it builds; the assistant needs a Gemini key to run.
      - name: Build the assistant image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assistant
          tags: hospitality-assistant:ci
          cache-from: type=gha,scope=assistant
          cache-to: type=gha,mode=max,scope=assistant

  deploy:
    name: Deploy to Cloud Run
    needs: [lint, secrets, tests, image]
    # Only from main, and only once the Google settings below exist.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # add a required reviewer in GitHub to approve each deploy
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets this job prove to Google who it is, with no stored key
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hospitality-repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # so the last commit can be compared with the one before it

      # Rebuild an image only when something that goes into it changed.
      - name: Work out what needs deploying
        id: changes
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "$changed"
          api=false
          assistant=false
          if echo "$changed" | grep -v '^src/assistant/' | grep -qE '^(data/raw/|src/|Dockerfile$|requirements\.txt$|constraints-experiments\.txt$|rebuild_model\.py$|config/config\.yaml$)'; then api=true; fi
          if echo "$changed" | grep -qE '^(src/assistant/|Dockerfile\.assistant$|requirements-assistant\.txt$)'; then assistant=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then api=true; assistant=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "assistant=$assistant" >> "$GITHUB_OUTPUT"
          echo "Deploy API: $api. Deploy assistant: $assistant."

      - uses: google-github-actions/auth@v2
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.assistant == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.assistant == 'true'
      - name: Let Docker push to Artifact Registry
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.assistant == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.assistant == 'true'

      # The API goes first: the assistant calls it.
      - name: Fetch the model the tests job rebuilt
        if: steps.changes.outputs.api == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rebuilt-model
      - name: Build and push the API image
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/hospitality-forecasting-api:${{ github.sha }}
            ${{ env.REGISTRY }}/hospitality-forecasting-api:latest
          cache-from: type=gha,scope=api
      - name: Deploy the API
        if: steps.changes.outputs.api == 'true'
        run: bash scripts/deploy_service.sh hospitality-forecasting-api "${REGISTRY}/hospitality-forecasting-api:${{ github.sha }}" api

      - name: Build and push the assistant image
        if: steps.changes.outputs.assistant == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assistant
          push: true
          tags: |
            ${{ env.REGISTRY }}/hospitality-forecasting-assistant:${{ github.sha }}
            ${{ env.REGISTRY }}/hospitality-forecasting-assistant:latest
          cache-from: type=gha,scope=assistant
      - name: Deploy the assistant
        if: steps.changes.outputs.assistant == 'true'
        run: >
          bash scripts/deploy_service.sh hospitality-forecasting-assistant "${REGISTRY}/hospitality-forecasting-assistant:${{ github.sha }}" page
